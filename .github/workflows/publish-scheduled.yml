name: Publish scheduled travel posts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: korplaylist-scheduled-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check editorial automation health
        run: node scripts/check-automation-health.mjs

      - name: Detect newly due posts
        run: node scripts/trigger-scheduled-publish.mjs

      - name: Trigger Cloudflare Pages when needed
        run: |
          if git diff --quiet -- .automation/published-posts.json; then
            echo "No deployment due."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/published-posts.json
          git commit -m "Trigger scheduled publication"
          git push origin HEAD:main
